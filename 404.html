<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Fox Fulbright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .nf {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 0 var(--gutter);
    max-width: var(--max);
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  .nf-num {
    font-family: var(--display);
    font-size: clamp(8rem, 25vw, 18rem);
    line-height: 0.9;
    color: var(--ink);
    font-variation-settings: "SOFT" 70, "WONK" 1;
    font-style: italic;
  }
  .nf-num .dot { color: var(--amber); }
  .nf-msg {
    font-family: var(--display);
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 300;
    color: var(--ink-dim);
    margin: 1rem 0 2rem;
    max-width: 40ch;
  }
  .nf-msg em { color: var(--amber); font-style: italic; }
  .nf-tag {
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 2rem;
  }
  .nf-tag span { color: var(--amber); }
  .nf-back {
    font-family: var(--mono);
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid var(--amber);
    padding-bottom: 2px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="nf">
  <p class="nf-tag"><span>// edge case:</span> 404</p>
  <h1 class="nf-num">404<span class="dot">.</span></h1>
  <p class="nf-msg">
    This page doesn't exist. <em>Good catch.</em> Most people miss the broken ones.
  </p>
  <a href="/" class="nf-back">← Back to safety</a>
</div>

<script src="script.js"></script>
</body>
</html>
